services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
  ride_hailing_be:
    build: .
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - "${DJANGO_PORT:-8000}:8000"

volumes:
  pg_data:
