services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
  app:
    build: .
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - "${DJANGO_PORT:-8000}:8000"
    volumes:
      - type: bind
        source: .
        target: /app
      - /app/.venv
volumes:
  pg_data: